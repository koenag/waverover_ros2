# Known AprilTag poses in the world coordinate frame.
# Positions are measured to the center of each tag, in meters.
#
# yaw_deg is the counterclockwise rotation from a reference
# tag orientation whose printed face points toward world -Y.
#
# Direction mapping:
#   yaw_deg: 0   -> face points -Y
#   yaw_deg: 90  -> face points +X
#   yaw_deg: 180 -> face points +Y
#   yaw_deg: 270 -> face points -X

frame_id: world
tag_family: tag36h11

tags:
  0:
    position: [2.580, 0.500, 0.110]
    yaw_deg: 270

  2:
    position: [2.580, 1.500, 0.110]
    yaw_deg: 270

  3:
    position: [2.260, 2.950, 0.110]
    yaw_deg: 0

  4:
    position: [1.280, 2.950, 0.110]
    yaw_deg: 0

  5:
    position: [0.000, 1.500, 0.110]
    yaw_deg: 90

  7:
    position: [0.000, 0.500, 0.110]
    yaw_deg: 90

  8:
    position: [1.650, 0.000, 0.110]
    yaw_deg: 180

  9:
    position: [0.500, 0.000, 0.110]
